{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi Sistema{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <script src="https://cdn.plot.ly/plotly-3.0.1.min.js"></script>
</head>
<body>

    <!-- Barra superior -->
    <header class="top-bar">
        <a href="{% url 'dashboard' %}" class="brand">
            <img src="../static/img/RedSobrevivientes_02-16.png" alt="Logo" class="brand-logo">
        </a>

        <nav class="nav-menu">
            <a href="{% url 'dashboard' %}"
               class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                <span class="nav-icon">▥</span>
                Dashboard
            </a>

            <a href="{% url 'formulario' %}"
               class="nav-link {% if request.resolver_match.url_name == 'formulario' %}active{% endif %}">
                <span class="nav-icon">▤</span>
                Formulario
            </a>

            <a href="{% url 'subir_archivo' %}"
               class="nav-link {% if request.resolver_match.url_name == 'subir_archivo' %}active{% endif %}">
                <span class="nav-icon">↑</span>
                Cargar datos
            </a>
        </nav>
    </header>

    <!-- Contenido de cada página -->
    <main class="main-content">
        <section class="content-card">
            {% block content %}
            <div class="welcome-panel">
                <div class="welcome-symbol">✦</div>
                <h2>Todo en un solo lugar</h2>
                <p>
                    Utiliza el menú superior para navegar entre los módulos
                    de tu aplicación.
                </p>
            </div>
            {% endblock %}
        </section>
    </main>

    <footer class="footer">
        <span>Plataforma de gestión · {% now "Y" %}</span>
    </footer>

    

</body>
</html>
